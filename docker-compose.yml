# Local Redis only. Postgres is the Supabase project referenced by DATABASE_URL.
#
#   npm run infra:up
#
# Values come from .env.development (compose only auto-loads `.env`, hence the
# explicit --env-file in the npm script). Bound to loopback so a laptop on a
# shared network is not serving an unauthenticated Redis.

services:
  redis:
    image: redis:${REDIS_IMAGE_TAG:?set REDIS_IMAGE_TAG in .env.development}
    container_name: khata-redis
    restart: unless-stopped
    # Every key this API writes carries a TTL, so an LRU policy under memory
    # pressure only ever drops reconstructible or short-lived state.
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:?set REDIS_MAXMEMORY in .env.development}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:?set REDIS_MAXMEMORY_POLICY in .env.development}
      - --appendonly
      - 'no'
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:?set REDIS_HOST_PORT in .env.development}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']

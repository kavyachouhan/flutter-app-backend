name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

      # Unit tests only. They configure themselves from tests/fixtures/env.ts
      # and never touch a database; integration tests against a dedicated
      # Supabase test project will get their own job, fed from repository
      # secrets, so no shared or production database is reachable from CI.
      - run: npm test
